# Use postgres/example user/password credentials
version: '3.1'

services:

  db:
    ports:
      - 5440:5432
    restart: unless-stopped
      
  web:
   volumes:
    - ./:/app
    - ./scec-php.ini:/etc/php.d/scec-php.ini
    - ./ctm-result:/usr/local/share/ctm/ctm-result
    - /var/www/html/CTM_DATASET_DIRECTORY:/usr/local/share/ctm-largedata-dir:ro
   restart: unless-stopped


